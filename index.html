<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahan Joseph - (Home)</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <style>
        /* Reset margins and set box sizing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Using default browser serif font stack */
            background-color: #ffffff;
            color: #000000;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
        }

        /* Left side title styling */
        .brand-title {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Style for brand title anchor to maintain exact original appearance */
        .brand-title a {
            color: inherit; /* Inherit black text color from body/parent */
            text-decoration: none; /* Remove default link underline */
        }

        /* Navigation links */
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.25rem;
            font-weight: normal;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Bolder single-line separator under the header */
        hr.header-divider {
            border: none;
            border-top: 2px solid #000000;
            margin: 0;
        }

        /* Main content area container */
        main {
            padding: 2rem;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <!-- Brand title wrapped in an anchor link pointing to home page -->
        <h1 class="brand-title">
            <a href="#">Ceylon Bible</a>
        </h1>
        
        <!-- Navigation links on right -->
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="./categories.html">Categories</a></li>
                <li><a href="./about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Bolder Single Line Separation -->
    <hr class="header-divider">

    <!-- Content below header will go inside this main tag -->
    <main>

    </main>

</body>
</html>
